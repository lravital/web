<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Teaching Resources</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#20252b}header{background:#315f8f;color:#fff;padding:28px 18px;text-align:center}h1{margin:0 0 8px}header p{margin:0;opacity:.9}main{max-width:1050px;margin:24px auto;padding:0 16px 50px}.search{position:sticky;top:0;z-index:5;background:#f4f6f9;padding:10px 0}.search input{width:100%;padding:15px 18px;border:1px solid #ccd3db;border-radius:10px;font-size:17px;background:#fff}.grade{background:#fff;border-radius:14px;margin:18px 0;box-shadow:0 2px 10px #0001;overflow:hidden}.grade-title{padding:18px 20px;font-size:23px;font-weight:700}.grade-body{padding:0 20px 20px}.category{margin-top:15px;border-top:1px solid #e5e8ec;padding-top:15px}.category h3{margin:0 0 10px;font-size:18px}.link{display:block;text-decoration:none;color:#174d7d;background:#eef5fb;border-radius:9px;padding:14px 16px;margin:9px 0}.link:hover{background:#e0edf8}.link-title{font-size:17px;font-weight:700}.desc{display:block;color:#59636e;font-size:14px;margin-top:5px}.no-results{text-align:center;background:#fff;padding:30px;border-radius:12px;color:#666}</style></head><body>
<header><h1 id="title">My Teaching Resources</h1><p>Science resources and useful links</p></header><main><div class="search"><input id="search" type="search" placeholder="Search resources, topics, grades or descriptions…"></div><div id="app"></div></main>
<script src="data.js"></script><script>
(function(){const app=document.getElementById('app'), search=document.getElementById('search'); if(typeof SITE_DATA==='undefined'){app.innerHTML='<div class="no-results">The resource data could not be loaded. Please make sure data.js is uploaded beside index.html.</div>';return;} document.getElementById('title').textContent=SITE_DATA.siteTitle||'My Teaching Resources';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(q=''){q=q.trim().toLowerCase();app.innerHTML='';let count=0;(SITE_DATA.grades||[]).forEach(g=>{const gm=(g.name||'').toLowerCase().includes(q);let cats=[];(g.categories||[]).forEach(c=>{const links=(c.links||[]).filter(l=>!q||gm||(c.name||'').toLowerCase().includes(q)||(l.name||'').toLowerCase().includes(q)||(l.description||'').toLowerCase().includes(q)||(l.url||'').toLowerCase().includes(q));if(links.length)cats.push({c,links});});if(!cats.length)return;const sec=document.createElement('section');sec.className='grade';sec.innerHTML='<div class="grade-title">'+esc(g.name)+'</div><div class="grade-body"></div>';const body=sec.querySelector('.grade-body');cats.forEach(({c,links})=>{const cat=document.createElement('div');cat.className='category';cat.innerHTML='<h3>'+esc(c.name)+'</h3>';links.forEach(l=>{count++;const a=document.createElement('a');a.className='link';a.href=l.url;a.target='_blank';a.rel='noopener';a.innerHTML='<span class="link-title">'+esc(l.name)+'</span>'+(l.description?'<span class="desc">'+esc(l.description)+'</span>':'');cat.appendChild(a);});body.appendChild(cat);});app.appendChild(sec);});if(!count)app.innerHTML='<div class="no-results">No matching resources found.</div>';}
search.addEventListener('input',()=>render(search.value));render();})();</script></body></html>
